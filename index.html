<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/global/style.css?v=20260101">
    <link rel="stylesheet" href="./local/index/core.css?v=20260101">
    <link rel="stylesheet" href="./local/index/search.css?v=20260101">
    <title>法令検索</title>
</head>

<body class="landing-mode">

    <header aria-hidden="true"></header>

    <main>
        <div id="bar">
            <div id="title">法令検索</div>
            <div id="search-container">
                <div id="search-bar">
                    <input id="search-input" type="search" placeholder="法令名を入力" aria-label="法令名を検索" autocomplete="off">
                    <div id="search-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--color-gray)"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
                    </div>
                    <button id="search-exec" type="button" aria-label="検索を実行" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--color-black)"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg>
                    </button>
                </div>
                <div id="quick-search-result" role="listbox" style="display: none;"></div>
            </div>
            <div id="search-filter-container" aria-label="法令種別" aria-hidden="true">
                <button id="search-filter-item-all" class="search-filter-item" type="button">すべて</button>
                <button id="search-filter-item-constitution" class="search-filter-item" type="button" style="display: none;">憲法</button>
                <button id="search-filter-item-act" class="search-filter-item" type="button" style="display: none;">法律</button>
                <button id="search-filter-item-cabinet-order" class="search-filter-item" type="button" style="display: none;">政令</button>
                <button id="search-filter-item-imperial-order" class="search-filter-item" type="button" style="display: none;">勅令</button>
                <button id="search-filter-item-ministerial-ordinance" class="search-filter-item" type="button" style="display: none;">府省令</button>
                <button id="search-filter-item-rule" class="search-filter-item" type="button" style="display: none;">規則</button>
                <button id="search-filter-item-misc" class="search-filter-item" type="button" style="display: none;">その他</button>
            </div>
            <div id="search-border" class="border" aria-hidden="true"></div>
        </div>
        <div id="content" aria-live="polite" aria-hidden="true">
            <div id="search-message"></div>
            <div id="search-result"></div>
        </div>
    </main>

    <div class="button-container">
        <div class="left">
        </div>
        <div class="center">
            <a href="/info.html?q=help" class="button-link"><div>使い方</div></a>
        </div>
        <div class="right">
            <a href="/info.html?q=terms" class="button-link"><div>利用規約</div></a>
            <div>・</div>
            <a href="/info.html?q=privacy" class="button-link"><div>プライバシー</div></a>
            <div>・</div>
            <a href="/info.html?q=about" class="button-link"><div>当サイトについて</div></a>
        </div>
    </div>

    <script type="module" src="./local/index/core.js?v=20260101"></script>

</body>

</html>
